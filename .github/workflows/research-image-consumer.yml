name: Research image consumer
'on':
  workflow_dispatch:
    inputs:
      image:
        description: Exact research image reference to run on a fresh hosted runner
        required: true
        type: string
permissions:
  contents: read
  packages: read
jobs:
  consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ${{ inputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
      options: --user root
    steps:
    - name: Compute over the rational numbers
      shell: bash
      run: 'python - <<''PYTHON''

        import sys

        from sage.all import QQ, matrix

        assert sys.prefix == "/sage/.venv"

        assert matrix(QQ, [[2, 1], [1, 2]]).det() == 3

        print(sys.executable)

        PYTHON

        '
    # The producer's build runs docker/research-environment-check.py, which
    # asserts this too; this step is the same claim made from a fresh runner on
    # the immutable digest, through the instance libgap actually drives. The
    # order below is a randomised (Monte Carlo) stabilizer chain bounded by
    # ErrorBound, so it is capability evidence and not an exact order for any
    # generated subgroup of O(V). Mirrors results/consumer-check.py.
    - name: Load GAP's matrix-group order and recognition packages
      shell: bash
      run: |
        python - <<'PYTHON'
        import sys
        from sage.libs.gap.libgap import libgap
        from sage.libs.gap.util import kernel_info

        version, arch, roots = kernel_info()
        print("kernel:", version, arch)
        print("roots:", roots)
        assert sys.prefix == "/sage/.venv", sys.prefix
        assert "/sage/.venv/lib/gap/" in roots, roots
        for name in ("orb", "forms", "genss", "recog"):
            loaded = libgap.eval('LoadPackage("%s")' % name)
            assert loaded.sage() is True, (name, loaded)
            print("LoadPackage(%s) = true, version %s"
                  % (name, libgap.eval('PackageInfo("%s")[1].Version' % name)))
        for name in ("RecognizeGroup", "StabilizerChain", "SizeMC"):
            assert libgap.eval('IsBound(%s)' % name).sage() is True, name
        # GAP's `fail` has no Sage conversion, so compare inside GAP.
        assert libgap.eval('LoadPackage("not_a_gap_package") = fail').sage() is True

        borel = libgap.function_factory(
            "function(d) local F, g, i, m; F := GF(5); g := []; "
            "for i in [1..d-1] do m := IdentityMat(d, F); m[i][i+1] := One(F); Add(g, m); od; "
            "m := IdentityMat(d, F); m[1][1] := Z(5); Add(g, m); return Group(g); end"
        )
        chain = libgap.function_factory(
            "function(G) return StabilizerChain(G, rec(ErrorBound := 1/10^6)); end"
        )
        order = libgap.function_factory("Size")(chain(borel(4))).sage()
        assert order == 4 * 5**6, order
        print("genss chain order of the deg-4 GF(5) Borel:", order)
        print("CONSUMER CAPABILITY CHECK PASSED")
        PYTHON
