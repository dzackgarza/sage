name: Research issue 564 pinned Sage image and public consumer acceptance

on:
  push:
    branches: [fix-spinor-generator-accumulation-clean]
    paths:
      - '.github/workflows/research-564-pinned-image.yml'
      - 'docker/research-environment.Dockerfile'
      - 'src/sage/quadratic_forms/genera/genus.py'

permissions:
  contents: read
  packages: write

concurrency:
  group: research-spinor-image-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.image-tag.outputs.tag }}
      source_sha: ${{ steps.patch-revision.outputs.source_sha }}
    steps:
      - name: Check out current Sage develop as the complete build context
        uses: actions/checkout@v4
        with:
          ref: develop
          path: sage-source
          fetch-depth: 1

      - name: Check out the triggering Sage fix revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .spinor-patch
          fetch-depth: 0

      - name: Apply only the maintained spinor-generator source change
        id: patch-revision
        env:
          BUILD_TRIGGER_SHA: ${{ github.sha }}
          SPINOR_PATCH_SHA: be7579575935bc25bcebb595a5a3889ad4673420
        run: |
          test "$(git -C .spinor-patch rev-parse HEAD)" = "$BUILD_TRIGGER_SHA"
          test "$(git -C .spinor-patch merge-base "$BUILD_TRIGGER_SHA" "$SPINOR_PATCH_SHA")" = "$SPINOR_PATCH_SHA"
          git -C .spinor-patch diff 601df58edafe95f68597b9dec61e0a75adca8983 "$SPINOR_PATCH_SHA" -- src/sage/quadratic_forms/genera/genus.py > .spinor.patch
          test -s .spinor.patch
          git -C sage-source apply --check ../.spinor.patch
          git -C sage-source apply ../.spinor.patch
          printf '%s\n' "$SPINOR_PATCH_SHA" > sage-source/.spinor-source-revision
          git -C sage-source rev-parse HEAD > sage-source/.spinor-base-revision
          git -C sage-source diff --check
          # The research environment dependency has a private submodule URL in SSH form.
          # Build runners have no SSH key; rewrite GitHub SSH URLs to the equivalent HTTPS URL.
          git -C sage-source config --file docker/research-environment.Dockerfile.invalid --get-regexp . >/dev/null 2>&1 || true
          sed -i '/^RUN just research-environment-sync$/i RUN git config --global url."https://github.com/".insteadOf "git@github.com:"' sage-source/docker/research-environment.Dockerfile
          echo "source_sha=$SPINOR_PATCH_SHA" >> "$GITHUB_OUTPUT"
          printf 'Build trigger SHA: %s\nApplied Sage PR SHA: %s\n' "$BUILD_TRIGGER_SHA" "$SPINOR_PATCH_SHA"
          git -C sage-source diff -- src/sage/quadratic_forms/genera/genus.py

      - name: Install generated Maxima indexes in the Sage runtime prefix
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          dockerfile = Path("sage-source/docker/research-environment.Dockerfile")
          source = dockerfile.read_text()
          marker = "RUN just research-environment-sync\n"
          install = r'''RUN set -eu; \
              info_dir=/sage/.venv/share/info; \
              mkdir -p "$info_dir"; \
              for name in maxima-index.lisp maxima-index-html.lisp; do \
                  source="$(find /sage/builddir/subprojects/maxima-5.47.0 -type f -name "$name" -print -quit)"; \
                  if [ -z "$source" ]; then echo "FATAL: Maxima generated index $name not found" >&2; exit 1; fi; \
                  cp "$source" "$info_dir/$name"; \
              done

ENV MAXIMA_PREFIX=/sage/.venv
'''
          assert marker in source
          dockerfile.write_text(source.replace(marker, marker + install + "\n", 1))
          PYTHON

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Select trigger-addressed immutable image tag
        id: image-tag
        env:
          SAGE_SOURCE_SHA: ${{ github.sha }}
        run: |
          tag="spinor-$SAGE_SOURCE_SHA"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/sage:$tag"
          set +e
          output="$(docker manifest inspect "$image" 2>&1)"
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif grep -qiE 'manifest unknown|no such manifest|not found|404' <<<"$output"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "$output" >&2
            echo "Registry lookup failed; refusing to publish without proving the tag absent" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build and publish the isolated Sage image
        if: steps.image-tag.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: sage-source
          file: sage-source/docker/research-environment.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/sage:${{ steps.image-tag.outputs.tag }}
          labels: |
            org.opencontainers.image.revision=${{ steps.patch-revision.outputs.source_sha }}
            org.opencontainers.image.source=https://github.com/dzackgarza/sage
            org.opencontainers.image.title=Research Sage image with spinor generator correction
          cache-from: type=gha
          cache-to: type=gha,mode=max

  consumer-acceptance:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/${{ github.repository_owner }}/sage:${{ needs.publish.outputs.image_tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Verify exact image provenance and Sage build base
        env:
          SAGE_SOURCE_SHA: ${{ needs.publish.outputs.source_sha }}
        run: |
          test "$(cat /sage/.spinor-source-revision)" = "$SAGE_SOURCE_SHA"
          printf 'Applied Sage source SHA: %s\n' "$(cat /sage/.spinor-source-revision)"
          printf 'Sage develop base SHA: %s\n' "$(cat /sage/.spinor-base-revision)"
          "$SAGE_BIN" --version

      - name: Check out public consumer assertions
        uses: actions/checkout@v4
        with:
          repository: dzackgarza/sage-extensions
          ref: main

      - name: Install the checked-out sage-extensions source
        run: '"$SAGE_BIN" -pip install --no-deps -e .'

      - name: Install the Sage pytest collector plugin
        uses: actions/checkout@v4
        with:
          repository: dzackgarza/ai-review-ci
          ref: main
          path: .qc-infra

      - name: Run the unchanged published four-spinor-genus assertion
        env:
          PYTHONPATH: ${{ github.workspace }}/.qc-infra/scripts/pytest_plugins
        run: >-
          "$SAGE_BIN" -python -m pytest
          -p qc_sage_session
          tests/lattices/test_genus.sage
          -k test_published_four_spinor_genus_is_counted_from_all_generators
