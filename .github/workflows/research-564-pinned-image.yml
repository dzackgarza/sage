name: Research issue 564 pinned Sage image and public consumer acceptance

on:
  workflow_dispatch:
  push:
    branches: [fix-spinor-generator-accumulation-clean, research-564-image-ci]
    paths:
      - '.github/workflows/research-564-pinned-image.yml'
      - 'docker/research-environment.Dockerfile'
      - 'docker/research-environment.uv.lock'
      - 'docker/research-maxima-prefix.patch'
      - 'build/pkgs/maxima/spkg-install.in'
      - 'subprojects/packagefiles/maxima/build/doc/info/meson.build'
      - 'subprojects/packagefiles/maxima/meson.build'
      - 'subprojects/packagefiles/ecl/src/meson.build'
      - 'subprojects/packagefiles/ecl/meson.build'
      - 'subprojects/ecl.wrap'
      - 'subprojects/packagefiles/ecl/59de50b52380132d44bfa05f573544cba0a8c65f.patch'
      - 'subprojects/packagefiles/ecl/ecl_side_modules_path.patch'
      - 'subprojects/packagefiles/ecl/src/sage-ecl-config.in'
      - 'subprojects/packagefiles/maxima/build_dependency.c'
      - 'subprojects/packagefiles/maxima/maxima_fas_install.patch'
      - 'src/sage/interfaces/maxima_lib.py'
      - 'justfile'
      - 'src/sage/quadratic_forms/genera/genus.py'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    concurrency:
      # Serialize producers without cancelling a long image build when only
      # the consumer test revision or workflow metadata changes. Queued runs
      # re-check the immutable image tag and reuse it after the first publish.
      group: research-spinor-image-${{ github.ref }}
      cancel-in-progress: false
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.image-tag.outputs.tag }}
      source_sha: ${{ steps.patch-revision.outputs.source_sha }}
      base_sha: ${{ steps.patch-revision.outputs.base_sha }}
      dockerfile_sha: ${{ steps.patch-revision.outputs.dockerfile_sha }}
      patchset_sha: ${{ steps.patch-revision.outputs.patchset_sha }}
      research_env_sha: ${{ steps.patch-revision.outputs.research_env_sha }}
      sage_categories_sha: ${{ steps.patch-revision.outputs.sage_categories_sha }}
    steps:
      - name: Check out the exact Sage develop base as the complete build context
        uses: actions/checkout@v4
        with:
          ref: 36e49d91b0568f07ad4373362c15ce8970587e67
          path: sage-source
          fetch-depth: 1

      - name: Check out the triggering Sage fix revision
        uses: actions/checkout@v4
        with:
          # Pin the maintained source PR head, not the independent image-CI
          # branch that happens to trigger this producer workflow.
          ref: b963c7c613217d25cc93c3beed5893bc560ce1c0
          path: .spinor-patch
          fetch-depth: 0

      - name: Check out the image environment patch revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .image-patches
          fetch-depth: 0

      - name: Check out the locked research environment metadata
        uses: actions/checkout@v4
        with:
          repository: dzackgarza/research
          ref: 217fbdbc789e7a4c75d70e53ebbf398df78990b8
          path: .research-env
          sparse-checkout: |
            pyproject.toml
            uv.lock
          sparse-checkout-cone-mode: false

      - name: Check out the locked sage-categories workspace
        uses: actions/checkout@v4
        with:
          repository: dzackgarza/sage-categories
          ref: 37ec1642fe19f24fb00f402fe45350341ebf6920
          path: .sage-categories
          fetch-depth: 1

      - name: Apply maintained Sage spinor and Maxima source changes
        id: patch-revision
        env:
          SPINOR_PATCH_SHA: b963c7c613217d25cc93c3beed5893bc560ce1c0
          BUILD_TRIGGER_SHA: ${{ github.sha }}
        run: |
          test "$(git -C .spinor-patch rev-parse HEAD)" = "$SPINOR_PATCH_SHA"
          RESEARCH_ENV_SHA="$(git -C .research-env rev-parse HEAD)"
          test "$RESEARCH_ENV_SHA" = 217fbdbc789e7a4c75d70e53ebbf398df78990b8
          SAGE_CATEGORIES_SHA="$(git -C .sage-categories rev-parse HEAD)"
          test "$SAGE_CATEGORIES_SHA" = 37ec1642fe19f24fb00f402fe45350341ebf6920
          mkdir -p sage-source/.research-env
          cp .research-env/pyproject.toml sage-source/.research-env/pyproject.toml
          cp .image-patches/docker/research-environment.uv.lock sage-source/.research-env/uv.lock
          cp -a .sage-categories sage-source/.research-env/sage-categories
          printf '%s\n' "$SAGE_CATEGORIES_SHA" > sage-source/.spinor-sage-categories-revision
          rm -rf sage-source/.research-env/sage-categories/.git
          printf '%s\n' "$RESEARCH_ENV_SHA" > sage-source/.spinor-research-env-revision
          # Apply the full maintained genus.py delta from the build base to
          # the triggering branch revision, including owner-level acceptance
          # doctests added after the original implementation commit. The
          # patch-set digest records that complete delta independently of the
          # immutable owner-fix provenance SHA.
          git -C .spinor-patch diff 36e49d91b0568f07ad4373362c15ce8970587e67 "$SPINOR_PATCH_SHA" -- src/sage/quadratic_forms/genera/genus.py > .spinor.patch
          test -s .spinor.patch
          git -C sage-source apply --check ../.spinor.patch
          git -C sage-source apply ../.spinor.patch
          # The build base is develop, so explicitly carry the maintained
          # Maxima package-install changes from the triggering source branch.
          diff -u --label a/build/pkgs/maxima/spkg-install.in --label b/build/pkgs/maxima/spkg-install.in sage-source/build/pkgs/maxima/spkg-install.in .image-patches/build/pkgs/maxima/spkg-install.in > .maxima-spkg.patch || test "$?" -eq 1
          if [ -s .maxima-spkg.patch ]; then
            git -C sage-source apply --check ../.maxima-spkg.patch
            git -C sage-source apply ../.maxima-spkg.patch
          fi
          # Carry the focused build-tool upgrade from the maintained source
          # branch: frozen uv sync pins Meson 1.10.0, but Maxima 5.47.0 needs
          # >=1.11.2 before the Sage Meson project is configured.
          # develop has no justfile; generate a new-file patch in that case.
          if [ -f sage-source/justfile ]; then
            diff -u --label a/justfile --label b/justfile sage-source/justfile .image-patches/justfile > .meson-toolchain.patch || test "$?" -eq 1
          else
            diff -u --label /dev/null --label b/justfile /dev/null .image-patches/justfile > .meson-toolchain.patch || test "$?" -eq 1
          fi
          if [ -s .meson-toolchain.patch ]; then
            git -C sage-source apply --check ../.meson-toolchain.patch
            git -C sage-source apply ../.meson-toolchain.patch
          fi
          # Carry the maintained Maxima Meson packaging change as well. It is
          # currently identical to develop, so this patch is empty; retaining
          # it in the pipeline prevents a future source change being ignored.
          diff -u --label a/subprojects/packagefiles/maxima/build/doc/info/meson.build --label b/subprojects/packagefiles/maxima/build/doc/info/meson.build sage-source/subprojects/packagefiles/maxima/build/doc/info/meson.build .image-patches/subprojects/packagefiles/maxima/build/doc/info/meson.build > .maxima-meson.patch || test "$?" -eq 1
          if [ -s .maxima-meson.patch ]; then
            git -C sage-source apply --check ../.maxima-meson.patch
            git -C sage-source apply ../.maxima-meson.patch
          fi
          # Carry the Maxima ECL build-order correction into the exact source tree.
          if [ -f sage-source/subprojects/packagefiles/maxima/maxima_fas_install.patch ]; then
            diff -u --label a/subprojects/packagefiles/maxima/maxima_fas_install.patch --label b/subprojects/packagefiles/maxima/maxima_fas_install.patch sage-source/subprojects/packagefiles/maxima/maxima_fas_install.patch .image-patches/subprojects/packagefiles/maxima/maxima_fas_install.patch > .maxima-fas-install.patch || test "$?" -eq 1
          else
            diff -u --label /dev/null --label b/subprojects/packagefiles/maxima/maxima_fas_install.patch /dev/null .image-patches/subprojects/packagefiles/maxima/maxima_fas_install.patch > .maxima-fas-install.patch || test "$?" -eq 1
          fi
          if [ -s .maxima-fas-install.patch ]; then
            git -C sage-source apply --check ../.maxima-fas-install.patch
            git -C sage-source apply ../.maxima-fas-install.patch
          fi
          # Carry the maintained ECL-provider selection into the image source.
          # Without this, the image rebuilds sage.libs.ecl against the base
          # system ECL while Maxima's FAS is linked to the staged ECL 26.5.5;
          # loading both runtimes in one process segfaults during conway_mass.
          diff -u --label a/src/sage/libs/meson.build --label b/src/sage/libs/meson.build sage-source/src/sage/libs/meson.build .image-patches/src/sage/libs/meson.build > .sage-ecl-provider.patch || test "$?" -eq 1
          if [ -s .sage-ecl-provider.patch ]; then
            git -C sage-source apply --check ../.sage-ecl-provider.patch
            git -C sage-source apply ../.sage-ecl-provider.patch
          fi
          # The base wrap does not list this new patch in diff_files; enable it
          # explicitly or Meson silently ignores the ECL build-order correction.
          cp sage-source/subprojects/maxima.wrap .maxima-wrap.original
          if ! grep -q 'maxima/maxima_fas_install.patch' sage-source/subprojects/maxima.wrap; then
            sed -i '/^diff_files = /s/$/, maxima\/maxima_fas_install.patch/' sage-source/subprojects/maxima.wrap
          fi
          grep -q 'maxima/maxima_fas_install.patch' sage-source/subprojects/maxima.wrap
          diff -u --label a/subprojects/maxima.wrap --label b/subprojects/maxima.wrap .maxima-wrap.original sage-source/subprojects/maxima.wrap > .maxima-wrap-enable.patch || test "$?" -eq 1
          # Maxima's Lisp loader expects MAXIMA_PREFIX to be the installed
          # share/maxima/<version>/share directory, not the staging prefix
          # root. Carry this path correction from the maintained source branch.
          diff -u --label a/subprojects/packagefiles/maxima/meson.build --label b/subprojects/packagefiles/maxima/meson.build sage-source/subprojects/packagefiles/maxima/meson.build .image-patches/subprojects/packagefiles/maxima/meson.build > .maxima-prefix-path.patch || test "$?" -eq 1
          if [ -s .maxima-prefix-path.patch ]; then
            git -C sage-source apply --check ../.maxima-prefix-path.patch
            git -C sage-source apply ../.maxima-prefix-path.patch
          fi
          # Keep the ECL wrap and its packagefile patches in lockstep with the
          # maintained 26.5.5 source. Develop's wrap still fetches 26.3.27 and
          # lacks the two patch files consumed by the maintained wrap-file.
          diff -u --label a/subprojects/ecl.wrap --label b/subprojects/ecl.wrap sage-source/subprojects/ecl.wrap .image-patches/subprojects/ecl.wrap > .ecl-wrap.patch || test "$?" -eq 1
          if [ -s .ecl-wrap.patch ]; then
            git -C sage-source apply --check ../.ecl-wrap.patch
            git -C sage-source apply ../.ecl-wrap.patch
          fi
          for patch_file in 59de50b52380132d44bfa05f573544cba0a8c65f.patch ecl_side_modules_path.patch; do
            if [ -f "sage-source/subprojects/packagefiles/ecl/$patch_file" ]; then
              diff -u --label "a/subprojects/packagefiles/ecl/$patch_file" --label "b/subprojects/packagefiles/ecl/$patch_file" "sage-source/subprojects/packagefiles/ecl/$patch_file" ".image-patches/subprojects/packagefiles/ecl/$patch_file" > ".ecl-package-$patch_file.patch" || test "$?" -eq 1
            else
              diff -u --label /dev/null --label "b/subprojects/packagefiles/ecl/$patch_file" /dev/null ".image-patches/subprojects/packagefiles/ecl/$patch_file" > ".ecl-package-$patch_file.patch" || test "$?" -eq 1
            fi
            if [ -s ".ecl-package-$patch_file.patch" ]; then
              git -C sage-source apply --check "../.ecl-package-$patch_file.patch"
              git -C sage-source apply "../.ecl-package-$patch_file.patch"
            fi
          done
          # The research image Dockerfile belongs to the image-CI branch, not
          # upstream Sage develop. Install that maintained build recipe into
          # the pinned Sage source context before applying checked markers.
          mkdir -p sage-source/docker
          cp .image-patches/docker/research-environment.Dockerfile sage-source/docker/research-environment.Dockerfile
          # The ECL child meson.build derives ecl_version from its parent
          # project. Carry the parent packagefile too: develop's project has no
          # version, so project_version() otherwise returns "undefined" and
          # the child builds against an invalid staged ECL directory.
          diff -u --label a/subprojects/packagefiles/ecl/meson.build --label b/subprojects/packagefiles/ecl/meson.build sage-source/subprojects/packagefiles/ecl/meson.build .image-patches/subprojects/packagefiles/ecl/meson.build > .ecl-project-meson.patch || test "$?" -eq 1
          if [ -s .ecl-project-meson.patch ]; then
            git -C sage-source apply --check ../.ecl-project-meson.patch
            git -C sage-source apply ../.ecl-project-meson.patch
          fi
          # The maintained ECL packagefile exposes its staged binary,
          # configuration helper, version, and side-module paths to Maxima.
          # Apply those changes too: the Maxima fallback consumes ecl_dep's
          # version() and get_variable('ecl_bin') contracts.
          diff -u --label a/subprojects/packagefiles/ecl/src/meson.build --label b/subprojects/packagefiles/ecl/src/meson.build sage-source/subprojects/packagefiles/ecl/src/meson.build .image-patches/subprojects/packagefiles/ecl/src/meson.build > .ecl-meson.patch || test "$?" -eq 1
          if [ -s .ecl-meson.patch ]; then
            git -C sage-source apply --check ../.ecl-meson.patch
            git -C sage-source apply ../.ecl-meson.patch
          fi
          # The maintained ECL Meson file consumes this sibling template,
          # which does not exist in develop; add it as a real new-file patch.
          if [ -f sage-source/subprojects/packagefiles/ecl/src/sage-ecl-config.in ]; then
            diff -u --label a/subprojects/packagefiles/ecl/src/sage-ecl-config.in --label b/subprojects/packagefiles/ecl/src/sage-ecl-config.in sage-source/subprojects/packagefiles/ecl/src/sage-ecl-config.in .image-patches/subprojects/packagefiles/ecl/src/sage-ecl-config.in > .ecl-config-template.patch || test "$?" -eq 1
          else
            diff -u --label /dev/null --label b/subprojects/packagefiles/ecl/src/sage-ecl-config.in /dev/null .image-patches/subprojects/packagefiles/ecl/src/sage-ecl-config.in > .ecl-config-template.patch || test "$?" -eq 1
          fi
          if [ -s .ecl-config-template.patch ]; then
            git -C sage-source apply --check ../.ecl-config-template.patch
            git -C sage-source apply ../.ecl-config-template.patch
          fi
          # The maintained Maxima ECL fallback adds a build-order anchor that
          # is absent from develop. Generate a proper new-file patch when needed.
          if [ -f sage-source/subprojects/packagefiles/maxima/build_dependency.c ]; then
            diff -u --label a/subprojects/packagefiles/maxima/build_dependency.c --label b/subprojects/packagefiles/maxima/build_dependency.c sage-source/subprojects/packagefiles/maxima/build_dependency.c .image-patches/subprojects/packagefiles/maxima/build_dependency.c > .maxima-ecl-anchor.patch || test "$?" -eq 1
          else
            diff -u --label /dev/null --label b/subprojects/packagefiles/maxima/build_dependency.c /dev/null .image-patches/subprojects/packagefiles/maxima/build_dependency.c > .maxima-ecl-anchor.patch || test "$?" -eq 1
          fi
          if [ -s .maxima-ecl-anchor.patch ]; then
            git -C sage-source apply --check ../.maxima-ecl-anchor.patch
            git -C sage-source apply ../.maxima-ecl-anchor.patch
          fi
          # Sage's MAXIMA_PREFIX remains the staging prefix for Maxima's
          # own pathname setup and CL-INFO. Its package loader must separately
          # search the installed versioned share tree below that prefix.
          diff -u --label a/src/sage/interfaces/maxima_lib.py --label b/src/sage/interfaces/maxima_lib.py sage-source/src/sage/interfaces/maxima_lib.py .image-patches/src/sage/interfaces/maxima_lib.py > .maxima-loader-path.patch || test "$?" -eq 1
          if [ -s .maxima-loader-path.patch ]; then
            git -C sage-source apply --check ../.maxima-loader-path.patch
            git -C sage-source apply ../.maxima-loader-path.patch
          fi
          printf '%s\n' "$SPINOR_PATCH_SHA" > sage-source/.spinor-source-revision
          git -C sage-source rev-parse HEAD > sage-source/.spinor-base-revision
          git -C sage-source diff --check
          # Apply image-specific changes by unique Dockerfile markers rather than a line-number-sensitive patch against moving develop.
          python - <<'PY'
          from pathlib import Path
          dockerfile = Path("sage-source/docker/research-environment.Dockerfile")
          source = dockerfile.read_text()
          replacements = (
              ('RUN curl -LsSf https://just.systems/install.sh | bash -s -- --to /usr/local/bin', 'RUN apt-get update && apt-get install -y --no-install-recommends just && rm -rf /var/lib/apt/lists/*'),
              ('ENV MAXIMA_PREFIX=/sage/builddir/subprojects/maxima-5.47.0/dist/usr/local', 'ENV MAXIMA_PREFIX=/sage/.venv'),
          )
          for old, new in replacements:
              if source.count(old) != 1:
                  raise SystemExit(f"expected exactly one Dockerfile marker: {old!r}")
              source = source.replace(old, new)
          marker = 'RUN just research-environment-sync\n'
          if source.count(marker) != 1:
              raise SystemExit("expected exactly one environment-sync marker")
          maxima = 'RUN set -eu; srcdir=$(find /sage/builddir/subprojects/maxima-5.47.0 -type f -path "*/src/Makefile" -print -quit | xargs -r dirname); test -n "$srcdir"; make -C "$srcdir" binary-ecl/maxima; src="$srcdir/binary-ecl/maxima.fas"; test -s "$src"; dst=/sage/.venv/lib/ecl-26.5.5/maxima.fas; install -D -m 0644 "$src" "$dst"; test -s "$dst"\nENV MAXIMA_FAS=/sage/.venv/lib/ecl-26.5.5/maxima.fas\n'
          source = source.replace(marker, marker + maxima)
          dockerfile.write_text(source)
          PY
          git -C sage-source diff --check
          sed -i 's#^RUN just research-environment-sync$#RUN just research-environment-sync || { cat /sage/builddir/meson-logs/maxima-5.47.0-build.log; exit 1; }#' sage-source/docker/research-environment.Dockerfile
          sed -i '/^RUN just research-environment-sync/i RUN git config --global url.\"https://github.com/\".insteadOf \"git@github.com:\"' sage-source/docker/research-environment.Dockerfile
          git -C sage-source diff --check
          BASE_SHA="$(cat sage-source/.spinor-base-revision)"
          DOCKERFILE_SHA="$(sha256sum sage-source/docker/research-environment.Dockerfile | head -c 64)"
          # Hash every generated patch rather than maintaining a parallel
          # hand-written inventory that can silently omit a newly applied one.
          PATCHSET_SHA="$({ find . -maxdepth 1 -type f -name '*.patch' -print0 | sort -z | xargs -0 sha256sum; sha256sum .image-patches/docker/research-environment.uv.lock sage-source/.research-env/pyproject.toml sage-source/.spinor-sage-categories-revision; } | sha256sum | cut -c 1-64)"
          echo "source_sha=$SPINOR_PATCH_SHA" >> "$GITHUB_OUTPUT"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "dockerfile_sha=$DOCKERFILE_SHA" >> "$GITHUB_OUTPUT"
          echo "patchset_sha=$PATCHSET_SHA" >> "$GITHUB_OUTPUT"
          echo "research_env_sha=$RESEARCH_ENV_SHA" >> "$GITHUB_OUTPUT"
          echo "sage_categories_sha=$SAGE_CATEGORIES_SHA" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$DOCKERFILE_SHA" > sage-source/.spinor-dockerfile-sha
          printf '%s\n' "$PATCHSET_SHA" > sage-source/.spinor-patchset-sha
          printf 'Workflow trigger SHA: %s\nApplied Sage PR SHA: %s\nPatchset SHA: %s\n' "$GITHUB_SHA" "$SPINOR_PATCH_SHA" "$PATCHSET_SHA"
          git -C sage-source diff -- src/sage/quadratic_forms/genera/genus.py build/pkgs/maxima/spkg-install.in

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Select source-input-addressed immutable image tag
        id: image-tag
        env:
          SAGE_SOURCE_SHA: ${{ steps.patch-revision.outputs.source_sha }}
          SAGE_BASE_SHA: ${{ steps.patch-revision.outputs.base_sha }}
          DOCKERFILE_SHA: ${{ steps.patch-revision.outputs.dockerfile_sha }}
          PATCHSET_SHA: ${{ steps.patch-revision.outputs.patchset_sha }}
          RESEARCH_ENV_SHA: ${{ steps.patch-revision.outputs.research_env_sha }}
          SAGE_CATEGORIES_SHA: ${{ steps.patch-revision.outputs.sage_categories_sha }}
        run: |
          image_key="$(printf '%s\n%s\n%s\n%s\n%s\n%s' "$SAGE_SOURCE_SHA" "$SAGE_BASE_SHA" "$DOCKERFILE_SHA" "$PATCHSET_SHA" "$RESEARCH_ENV_SHA" "$SAGE_CATEGORIES_SHA" | sha256sum | cut -c 1-40)"
          tag="spinor-$image_key"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/sage:$tag"
          set +e
          output="$(docker manifest inspect "$image" 2>&1)"
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif grep -qiE 'manifest unknown|no such manifest|not found|404' <<<"$output"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "$output" >&2
            echo "Registry lookup failed; refusing to publish without proving the tag absent" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build and publish the isolated Sage image
        if: steps.image-tag.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: sage-source
          file: sage-source/docker/research-environment.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/sage:${{ steps.image-tag.outputs.tag }}
          labels: |
            org.opencontainers.image.revision=${{ steps.patch-revision.outputs.source_sha }}
            io.dzackgarza.sage.spinor-patchset=${{ steps.patch-revision.outputs.patchset_sha }}
            io.dzackgarza.sage.research-environment=${{ steps.patch-revision.outputs.research_env_sha }}
            io.dzackgarza.sage.categories=${{ steps.patch-revision.outputs.sage_categories_sha }}
            org.opencontainers.image.source=https://github.com/dzackgarza/sage
            org.opencontainers.image.title=Research Sage image with spinor generator correction
          cache-from: type=gha
          cache-to: type=gha,mode=max

  consumer-acceptance:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/${{ github.repository_owner }}/sage:${{ needs.publish.outputs.image_tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Verify exact image provenance and Sage build base
        env:
          SAGE_SOURCE_SHA: ${{ needs.publish.outputs.source_sha }}
          SAGE_BASE_SHA: ${{ needs.publish.outputs.base_sha }}
          DOCKERFILE_SHA: ${{ needs.publish.outputs.dockerfile_sha }}
          PATCHSET_SHA: ${{ needs.publish.outputs.patchset_sha }}
          RESEARCH_ENV_SHA: ${{ needs.publish.outputs.research_env_sha }}
          SAGE_CATEGORIES_SHA: ${{ needs.publish.outputs.sage_categories_sha }}
        run: |
          test "$(cat /sage/.spinor-source-revision)" = "$SAGE_SOURCE_SHA"
          test "$(cat /sage/.spinor-base-revision)" = "$SAGE_BASE_SHA"
          test "$(cat /sage/.spinor-dockerfile-sha)" = "$DOCKERFILE_SHA"
          test "$(cat /sage/.spinor-patchset-sha)" = "$PATCHSET_SHA"
          test "$(cat /sage/.spinor-research-env-revision)" = "$RESEARCH_ENV_SHA"
          test "$(cat /sage/.spinor-sage-categories-revision)" = "$SAGE_CATEGORIES_SHA"
          printf 'Applied Sage source SHA: %s\n' "$(cat /sage/.spinor-source-revision)"
          printf 'Sage develop base SHA: %s\n' "$(cat /sage/.spinor-base-revision)"
          "$SAGE_BIN" --version

      - name: Check out exact public consumer acceptance revision
        uses: actions/checkout@v4
        with:
          repository: dzackgarza/sage-extensions
          ref: 48b9163c19fa6fbf11c9889058f46ba9c9ff345b

      - name: Install the checked-out sage-extensions source
        run: /root/.local/bin/uv pip install --python /sage/.venv/bin/python --no-deps -e .

      - name: Install the exact isometry engine bridge dependency
        # The research lock and sage-extensions metadata point to this same
        # Git repository at different revisions. The locked environment already
        # supplies its dependencies, so replace only the package without asking
        # uv to re-resolve the conflicting direct-URL metadata.
        run: >-
          /root/.local/bin/uv pip install --no-deps --python /sage/.venv/bin/python
          'sage-julia-bridge @ git+https://github.com/dzackgarza/sage-julia-bridge@f85758d06c54a61f74cba0a1b328fbb5a29fddff'

      - name: Instantiate the installed bridge Julia project
        env:
          JULIA_DEPOT_PATH: "/tmp/julia-depot:/opt/julia-depot:"
        run: >-
          julia
          --project=/sage/.venv/lib/python3.14/site-packages/sage_julia_bridge/julia_env
          --startup-file=no --history-file=no --color=no
          -e 'using Pkg; Pkg.instantiate(); Pkg.precompile(); import JSON; using Oscar'

      - name: Install the pinned Sage pytest collector plugin
        uses: actions/checkout@v4
        with:
          repository: dzackgarza/ai-review-ci
          ref: adfd75d63bc2f931c3c472a68fa95a7e69aca6e7
          path: .qc-infra

      - name: Install required pytest plugins
        run: >-
          /root/.local/bin/uv pip install --python /sage/.venv/bin/python
          pytest-timeout pytest-reportlog

      - name: Diagnose ECL and Maxima runtime paths before acceptance
        run: |
          set -eu
          printf 'MAXIMA_FAS=%s\nMAXIMA_PREFIX=%s\nECLDIR=%s\nLD_LIBRARY_PATH=%s\n' \
            "${MAXIMA_FAS:-}" "${MAXIMA_PREFIX:-}" "${ECLDIR:-}" "${LD_LIBRARY_PATH:-}"
          test -n "${MAXIMA_FAS:-}"
          ls -l "$MAXIMA_FAS"
          od -An -tx1 -N16 "$MAXIMA_FAS"
          if command -v file >/dev/null 2>&1; then file "$MAXIMA_FAS"; fi
          if command -v ldd >/dev/null 2>&1; then ldd "$MAXIMA_FAS" || true; fi
          if command -v readelf >/dev/null 2>&1; then readelf -d "$MAXIMA_FAS" | grep -E 'NEEDED|RPATH|RUNPATH' || true; fi
          "$SAGE_BIN" -c 'from sage.libs.ecl import ecl_eval; print("ECL SYS directory:", ecl_eval("(si::get-library-pathname)"))'

      - name: Run the complete public genus acceptance suite
        env:
          PYTHONPATH: ${{ github.workspace }}/.qc-infra/tool-artifacts/pytest_plugins
        # The published twelve-class definite genus exercises the full
        # p-neighbour enumeration and independent automorphism-order sum. Give
        # this exact mathematical acceptance a bounded three-minute test
        # timeout rather than pytest-timeout's 60-second default.
        run: >-
          "$SAGE_BIN" -c
          'import sys, pytest; sys.exit(pytest.main(["--no-time-gates", "--timeout=600", "-p", "qc_sage_session", "tests/lattices/test_genus.sage"]))'

      - name: Verify native Sage spinor-generator quotient spanning
        run: |
          "$SAGE_BIN" -t /sage/src/sage/quadratic_forms/genera/genus.py
