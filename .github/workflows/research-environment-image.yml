# Publish the research Sage environment so every repository that writes Sage
# against this fork pulls one build instead of repeating it.
#
# Consumers run their job inside the image:
#
#     jobs:
#       qc:
#         runs-on: ubuntu-latest
#         container: ghcr.io/dzackgarza/sage:develop
#         env:
#           SAGE_BIN: /sage/.venv/bin/sage
#
# Copying the tree out of the image instead does not work, and quietly: Sage's
# extension modules link against the system libraries this image installs, so
# sage/rings/integer resolves libgmp.so.10 to /lib/x86_64-linux-gnu, outside
# the copied /sage. A `docker cp sage-env:/sage /sage` onto a bare runner
# produces a tree that cannot import sage.all.
#
# SAGE_ROOT is baked in at configure time, which is why the tree stays at
# /sage rather than being relocated.

name: Research environment image

on:
  push:
    branches: [develop]
    paths:
      - 'pyproject.toml'
      - 'uv.lock'
      - 'justfile'
      - 'meson.build'
      - 'src/**'
      - 'build/pkgs/**'
      - 'docker/research-environment.Dockerfile'
      - '.github/workflows/research-environment-image.yml'
  workflow_dispatch:
    inputs:
      sage_source_sha:
        description: Exact 40-character Sage source commit to build into an isolated image; omit only for ordinary develop publication
        required: false
        type: string

# A pinned-source build is isolated from develop publication and from other
# pinned builds. It cannot cancel a develop image build or overwrite its tag.
concurrency:
  group: research-environment-image-${{ inputs.sage_source_sha || github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the Docker build recipe
        uses: actions/checkout@v4
        with:
          ref: develop
          path: .image-tools
          sparse-checkout: docker/research-environment.Dockerfile

      - name: Check out the exact Sage source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sage_source_sha || github.sha }}
          path: sage-source
          fetch-depth: 1

      - name: Validate the source revision
        env:
          SAGE_SOURCE_SHA: ${{ inputs.sage_source_sha || github.sha }}
        run: |
          case "$SAGE_SOURCE_SHA" in
            *[!0-9a-fA-F]*|'') echo "sage_source_sha must be a full commit SHA" >&2; exit 1 ;;
          esac
          test "${#SAGE_SOURCE_SHA}" -eq 40
          test "$(git -C sage-source rev-parse HEAD)" = "$SAGE_SOURCE_SHA"
          echo "Building exact Sage source $SAGE_SOURCE_SHA"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: sage-source
          file: .image-tools/docker/research-environment.Dockerfile
          push: true
          # Only ordinary develop pushes update the shared tag. A pinned
          # dispatch publishes a tag derived from the exact source commit.
          tags: ghcr.io/${{ github.repository_owner }}/sage:${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' && !inputs.sage_source_sha && 'develop' || format('spinor-{0}', inputs.sage_source_sha || github.sha) }}
          labels: org.opencontainers.image.revision=${{ inputs.sage_source_sha || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
