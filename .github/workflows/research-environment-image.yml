# Publish the research Sage environment so every repository that writes Sage
# against this fork pulls one build instead of repeating it.
#
# Consumers run their job inside the image:
#
#     jobs:
#       qc:
#         runs-on: ubuntu-latest
#         container: ghcr.io/dzackgarza/sage:develop
#         env:
#           SAGE_BIN: /sage/.venv/bin/sage
#
# Sage's extension modules link against the system libraries installed in the
# image; the configured /sage tree is not relocatable.

name: Research environment image
on:
  push:
    branches: [develop]
    paths:
    - pyproject.toml
    - uv.lock
    - justfile
    - meson.build
    - src/**
    - build/pkgs/**
    - docker/research-environment.Dockerfile
    - docker/research-environment-incremental.Dockerfile
    - docker/relock-research-packages.sh
    - docker/research-environment-check.py
    - docker/install-research-repositories.sh
    - docker/research-repositories.txt
    - .github/workflows/research-environment-image.yml
  workflow_dispatch:
    inputs:
      sage_source_sha:
        description: Exact maintained Sage PR commit whose genus.py correction 
          is applied to current develop for an isolated image; omit for ordinary
          develop image
        required: false
        type: string
      relock:
        description: Lock every git-sourced research package at its head, build 
          the image on that lock, and commit it
        required: false
        type: boolean
        default: false
      zstd_probe:
        description: Build a tiny zstd-compressed image and pull it in a 
          container job, to prove the runner can read zstd layers
        required: false
        type: boolean
        default: false
concurrency:
  group: research-environment-image-${{ inputs.sage_source_sha || github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
      packages: write
    outputs:
      image_tag: ${{ steps.image-tag.outputs.tag }}
      source_sha: ${{ inputs.sage_source_sha || github.sha }}
    steps:
    - name: Check out the complete Sage build context
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event_name == 'push' && github.sha || 'develop' }}
        path: sage-source
          # /sage is the fork's working checkout in the image: full history,
          # contents fetched on demand.
        fetch-depth: 0
        filter: blob:none
          # .git goes into the image, so the token stays out of its config.
        persist-credentials: false
    - name: Check out the exact maintained Sage PR revision
      if: inputs.sage_source_sha != ''
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.sage_source_sha }}
        path: .spinor-patch
        fetch-depth: 0
    - name: Apply only the maintained spinor-generator source change
      if: inputs.sage_source_sha != ''
      env:
        SAGE_SOURCE_SHA: ${{ inputs.sage_source_sha }}
      run: |
        case "$SAGE_SOURCE_SHA" in
          *[!0-9a-fA-F]*|'') echo "sage_source_sha must be a full commit SHA" >&2; exit 1 ;;
        esac
        test "${#SAGE_SOURCE_SHA}" -eq 40
        test "$(git -C .spinor-patch rev-parse HEAD)" = "$SAGE_SOURCE_SHA"
        git -C .spinor-patch diff 601df58edafe95f68597b9dec61e0a75adca8983 "$SAGE_SOURCE_SHA" -- src/sage/quadratic_forms/genera/genus.py > .spinor.patch
        test -s .spinor.patch
        git -C sage-source apply --check ../.spinor.patch
        git -C sage-source apply ../.spinor.patch
        printf '%s\n' "$SAGE_SOURCE_SHA" > sage-source/.spinor-source-revision
        git -C sage-source rev-parse HEAD > sage-source/.spinor-base-revision
        git -C sage-source diff --check
        git -C sage-source diff -- src/sage/quadratic_forms/genera/genus.py
    - name: Record ordinary develop revision
      if: inputs.sage_source_sha == ''
      run: |
        git -C sage-source rev-parse HEAD > sage-source/.spinor-base-revision
        git -C sage-source rev-parse HEAD > sage-source/.spinor-source-revision
      # The image carries Sage's build tree, every research checkout and
      # Mathlib's build; the runner's preinstalled toolchains make room for it.
    - name: Free the runner's disk
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        df -h /
    - uses: docker/setup-buildx-action@v3
      id: setup-buildx
      # The Dockerfile's ccache mount lives in BuildKit, which each runner starts
      # empty; carry it through the Actions cache between runs. Restoring and
      # injecting is half the round trip: cache-dance only writes into the builder,
      # and the cache comes back to `ccache/` through a second invocation with
      # `extract: true` after the builds. Without that step nothing ever writes the
      # directory, so every run restored an empty cache.
    - name: Restore the Sage compiler cache
      uses: actions/cache@v4
      id: ccache
      with:
        path: ccache
        key: sage-ccache-${{ github.sha }}
        restore-keys: sage-ccache-
    - name: Inject the compiler cache into BuildKit
      uses: reproducible-containers/buildkit-cache-dance@v3.4.0
      with:
        builder: ${{ steps.setup-buildx.outputs.name }}
        cache-map: '{"ccache": "/ccache"}'
        skip-extraction: ${{ steps.ccache.outputs.cache-hit == 'true' }}
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Select the image tag and refuse overwrites
      id: image-tag
      env:
        SAGE_SOURCE_SHA: ${{ inputs.sage_source_sha || github.sha }}
        IS_DEVELOP: ${{ github.ref == 'refs/heads/develop' && 
          !inputs.sage_source_sha }}
      run: |
        if [ "$IS_DEVELOP" = "true" ]; then
          echo "tag=develop" >> "$GITHUB_OUTPUT"
          echo "exists=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        tag="spinor-$SAGE_SOURCE_SHA"
        image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/sage:$tag"
        set +e
        output="$(docker manifest inspect "$image" 2>&1)"
        status=$?
        set -e
        if [ "$status" -eq 0 ]; then
          echo "exists=true" >> "$GITHUB_OUTPUT"
        elif grep -qiE 'manifest unknown|no such manifest|not found|404' <<<"$output"; then
          echo "exists=false" >> "$GITHUB_OUTPUT"
        else
          printf '%s\n' "$output" >&2
          echo "Registry lookup failed; refusing to publish without proving the tag absent" >&2
          exit 1
        fi
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
      # As upstream's build.yml does, a source change is rebuilt on top of the
      # last published image. The full build runs when the system layers
      # changed, when a file was deleted (the incremental copy deletes
      # nothing), or for an isolated spinor image.
    - name: Select a full or an incremental build
      id: build-kind
      if: steps.image-tag.outputs.exists != 'true'
      env:
        BASE_IMAGE: ghcr.io/${{ github.repository_owner }}/sage:develop
        IS_SPINOR: ${{ inputs.sage_source_sha != '' }}
      run: |
        if [ "$IS_SPINOR" = "true" ]; then
          echo "kind=full" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        base_revision="$(docker buildx imagetools inspect "$BASE_IMAGE" --format '{{ index .Image.Config.Labels "org.opencontainers.image.revision" }}')"
        git -C sage-source fetch --depth 1 origin "$base_revision"
        changes="$(git -C sage-source diff --name-status "$base_revision" HEAD)"
        printf 'Changes since the base image (%s):\n%s\n' "$base_revision" "$changes"
        if grep -qE '^D|docker/research-environment\.Dockerfile$' <<<"$changes"; then
          echo "kind=full" >> "$GITHUB_OUTPUT"
        else
          echo "kind=incremental" >> "$GITHUB_OUTPUT"
        fi
    - name: Build and publish the selected Sage image
      if: steps.image-tag.outputs.exists != 'true'
      uses: docker/build-push-action@v6
      with:
        context: sage-source
        file: sage-source/docker/research-environment${{ 
          steps.build-kind.outputs.kind == 'incremental' && '-incremental' || ''
          }}.Dockerfile
        build-args: |
          BASE_IMAGE=ghcr.io/${{ github.repository_owner }}/sage:develop
          RELOCK=${{ inputs.relock && 'true' || 'false' }}
        push: true
        tags: ghcr.io/${{ github.repository_owner }}/sage:${{ 
          steps.image-tag.outputs.tag }}
        labels: org.opencontainers.image.revision=${{ inputs.sage_source_sha || 
          github.sha }}
          # Layers go to the registry: the Actions cache is capped at 10 GB
          # per repository, which a Sage image's layers exceed.
        cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner 
          }}/sage:buildcache
        cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner 
          }}/sage:buildcache,mode=max
      # Back out of the builder into `ccache/`, which actions/cache saves at job end.
      # It runs on failure too: a build that dies after compiling still warmed the
      # cache, and that is what makes the next full build cheap.
    - name: Extract the compiler cache from BuildKit
      if: always()
      uses: reproducible-containers/buildkit-cache-dance@v3.4.0
      with:
        builder: ${{ steps.setup-buildx.outputs.name }}
        cache-map: '{"ccache": "/ccache"}'
        extract: true

      # The lock stage reuses the build above from the BuildKit cache.
    - name: Export the lock the image was built on
      if: inputs.relock
      uses: docker/build-push-action@v6
      with:
        context: sage-source
        file: sage-source/docker/research-environment${{ 
          steps.build-kind.outputs.kind == 'incremental' && '-incremental' || ''
          }}.Dockerfile
        target: lock
        build-args: |
          BASE_IMAGE=ghcr.io/${{ github.repository_owner }}/sage:develop
          RELOCK=true
        cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner 
          }}/sage:buildcache
        outputs: type=local,dest=relock
    - name: Commit the lock
      if: inputs.relock
      working-directory: sage-source
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cp ../relock/uv.lock uv.lock
        git diff --stat -- uv.lock
        git diff --quiet -- uv.lock && exit 0
        git config user.name github-actions
        git config user.email 41898282+github-actions[bot]@users.noreply.github.com
        git commit -m "build: lock the research packages at their heads" -- uv.lock
        git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:develop
  # Runs on the published image of every image this workflow builds, the develop one
  # included: the consumer statements it makes -- the T_Co generator call, the
  # lattice-database contracts, the stage-1 record reproductions -- are claims about the
  # develop image, and `if: image_tag != 'develop'` meant none of them had ever run
  # against it.
  #
  # 30 minutes does not cover them. No run of the T_Co step exists on this image yet, so
  # the limit is raised rather than estimated: the step prints
  # `O(T_Co) generators: N in T s` and the record reproductions print their own times,
  # and those are what a later tightening should be based on.
# The consumer calls that compute: the T_Co generator call and the isotropic-line-orbit
# suite. Bounded on its own so a slow neighbour cannot take their time.
  consumer-mathematics:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/${{ github.repository_owner }}/sage:${{ needs.publish.outputs.image_tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - name: Verify the image embeds the requested patch and base revisions
      env:
        SAGE_SOURCE_SHA: ${{ needs.publish.outputs.source_sha }}
      run: |
        test "$(cat /sage/.spinor-source-revision)" = "$SAGE_SOURCE_SHA"
        printf 'spinor patch revision: %s\n' "$(cat /sage/.spinor-source-revision)"
        printf 'Sage build base revision: %s\n' "$(cat /sage/.spinor-base-revision)"
        "$SAGE_BIN" --version
    - name: Check out public consumer assertions
      uses: actions/checkout@v4
      with:
        repository: dzackgarza/sage-extensions
        ref: main
    - name: Install the checked-out sage-extensions source
      run: >-
        uv pip install --python /sage/.venv/bin/python --no-deps -e .
    - name: Install the Sage pytest collector plugin
      uses: actions/checkout@v4
      with:
        repository: dzackgarza/ai-review-ci
        ref: main
        path: .qc-infra
      # The spinor assertion is about the isolated image built from a Sage PR commit:
      # it pins a sage-extensions `main` checkout and a test whose subject is that
      # commit's genus correction. An ordinary develop image has no such patch to
      # assert, so the step keeps its original scope and the rest of the job runs
      # everywhere.
    - name: Run the unchanged published four-spinor-genus assertion
      if: inputs.sage_source_sha != ''
      env:
        PYTHONPATH: ${{ github.workspace 
          }}/.qc-infra/tool-artifacts/pytest_plugins
      run: >-
        /sage/.venv/bin/python -m pytest -p qc_sage_session tests/lattices/test_genus.sage
        -k test_published_four_spinor_genus_is_counted_from_all_generators
      # sage#14's consumer statement: an image in which sage_indefinite_port imports
      # and T_Co's O(T_Co) generator computation returns. The construction and the
      # call are taken verbatim from the research record
      # computations/reports/coble_tco_surjectivity_specimen.py, which ran it against
      # port 4f0ee50c (raised) and again at 991b88b0 (returns True); this job fails
      # unless it returns here too, and prints the revisions it ran on.
    - name: Construct T_Co and compute its O(T_Co) generators
      run: |
        /sage/.venv/bin/python - <<'PY'
        import json, subprocess, time, tomllib
        from importlib.metadata import distribution
        from pathlib import Path
        from sage.all import CartanMatrix, ZZ, block_diagonal_matrix, matrix
        from sage_extensions.all import Lattices
        import sage_extensions
        import sage_indefinite_port


        def checkout_of(module):
            """The git checkout the imported module lives in, or None."""
            path = Path(module.__file__).resolve()
            for parent in path.parents:
                if (parent / ".git").exists():
                    return parent
            return None


        def head(checkout):
            """The checkout's revision and git's stderr, or None.

            `safe.directory` is stated for the path being read, and it is a trust decision this
            job is entitled to make: the checkout is the job's own, created by its runner minutes
            earlier. The **hypothesis** for the 128 in run 42379122786 is ownership: the log shows
            the runner adding `safe.directory /__w/sage/sage` on the host and creating that
            workspace `.git` there, while `git -C /repos/...` succeeds in the same container. The
            run's stderr was never captured, so that is a hypothesis and not a finding. Stating
            the directory is not a skipped check: the revision is still read and still verified
            below, and an unreadable one still fails the step, printing git's words.
            """
            finished = subprocess.run(
                ["git", "-c", f"safe.directory={checkout}", "-C", str(checkout), "rev-parse", "HEAD"],
                capture_output=True, text=True, check=False,
            )
            stderr = (finished.stderr or "").strip()
            if finished.returncode != 0:
                return None, stderr
            return finished.stdout.strip(), stderr


        held = {
            package["name"]: package["source"]["git"].rsplit("#", 1)[-1]
            for package in tomllib.load(open("/sage/uv.lock", "rb"))["package"]
            if isinstance(package.get("source"), dict) and isinstance(package["source"].get("git"), str)
        }

        # An editable install's direct_url.json carries no vcs_info, so its commit_id reads
        # None and says nothing about what ran -- both are printed below because the record
        # needs the reader to see that. The revision that ran is the checkout the imported
        # module lives in, held against the image's own lock (not the caller's): the port
        # whose generator call this step asserts, and the provider it declares in
        # pyproject.toml's dependency-metadata, sage-extensions.
        # Two boundaries, two observations, and neither stands in for the other: the image's own
        # copy (what the image ships, held to its lock) and the checkout the import actually came
        # from (what this job installed). The step above installs the workflow's sage-extensions
        # checkout editable, so for that package they are different trees.
        for name, module in (("sage-indefinite-port", sage_indefinite_port), ("sage-extensions", sage_extensions)):
            raw = distribution(name).read_text("direct_url.json")
            print(f"{name}: direct_url.json commit_id {json.loads(raw).get('vcs_info', {}).get('commit_id') if raw else None}")
            shipped = Path("/repos") / name
            # Required, not conditional. A checkout that is not there is a failed obligation, and
            # no path through this block may end without the image's revision read and asserted.
            assert shipped.is_dir(), f"{name}: the image ships no checkout at {shipped}"
            found, complaint = head(shipped)
            assert found is not None, f"{name}: the image's {shipped} is unreadable: {complaint}"
            print(f"{name}: image checkout {shipped} at {found}, held {held[name]}")
            assert found == held[name], f"{name}: the image's checkout is {found}, the lock holds {held[name]}"
            print(f"{name}: imported from {module.__file__}")
            checkout = checkout_of(module)
            assert checkout is not None, f"{name}: no checkout holds {module.__file__}"
            found, complaint = head(checkout)
            assert found is not None, f"{name}: the imported checkout {checkout} is unreadable: {complaint}"
            if checkout == shipped:
                print(f"{name}: the import is the image's copy")
            else:
                print(f"{name}: the import is the consumer checkout {checkout} at {found}")

        PY
        # The generator call is a statement about the image's own components, so it runs where
        # those are the imports. The step above installs the workflow's sage-extensions checkout
        # editable for the separate owner-contract observation, and in run 42379122786 that
        # shadowed the image's provider: `sage_extensions` resolved to /__w/sage/sage/src/... The
        # path is therefore set here, and the imports are asserted rather than assumed.
        PYTHONPATH="/repos/sage-extensions/src:/repos/sage-indefinite-port/src${PYTHONPATH:+:$PYTHONPATH}" \
          /sage/.venv/bin/python - <<'COMPUTE'
        import time
        from pathlib import Path
        from sage.all import CartanMatrix, ZZ, block_diagonal_matrix, matrix
        from sage_extensions.all import Lattices
        import sage_extensions
        import sage_indefinite_port

        for module, shipped in ((sage_extensions, "/repos/sage-extensions"),
                                (sage_indefinite_port, "/repos/sage-indefinite-port")):
            path = Path(module.__file__).resolve()
            assert str(path).startswith(shipped + "/"), (
                f"{module.__name__} came from {path}, not the image's {shipped}"
            )
            print(f"{module.__name__}: {path}")

        # T_Co = <2> + U(2) + E8(2): rank 11, determinant -2048, signature (2, 9).
        U = matrix(ZZ, [[0, 1], [1, 0]])
        E8 = -CartanMatrix(["E", 8])
        gram = block_diagonal_matrix(matrix(ZZ, [[2]]), 2 * U, 2 * E8)
        L = Lattices(ZZ)([list(row) for row in gram.rows()])
        print(f"T_Co: rank {L.rank()}, determinant {L.determinant()}, signature {L.signature_pair()}")

        started = time.time()
        generators = L.Aut().group_generators()
        elapsed = time.time() - started
        generators = list(generators)
        assert generators, "the O(T_Co) generator computation returned nothing"
        print(f"O(T_Co) generators: {len(generators)} in {elapsed:.1f}s")

        started = time.time()
        assert L.discriminant_representation_is_surjective() is True
        print(f"discriminant_representation_is_surjective(): True in {time.time() - started:.1f}s")
        COMPUTE

      # Stage-1 acceptance is that the published counts reproduce inside the published
      # image, not on a PYTHONPATH binding to a working tree. The module is run from the
      # installed sage-extensions checkout, which is what the environment check asserts
      # is installed from /repos/sage-extensions.
    - name: Run sage-extensions' isotropic-line-orbit suite from the installed 
        checkout
      run: |
        set -eu
        checkout=/repos/sage-extensions
        test -d "${checkout}/tests/lattices"
        git -C "${checkout}" rev-parse HEAD
        /sage/.venv/bin/python -m pytest -o addopts= \
          "${checkout}/tests/lattices/test_isotropic_line_orbits_of_small_indefinite_lattices.sage" \
          -q -p qc_sage_session

      # lattice-database's 6JRR card has no computed field until `latticedb certify`
      # runs with Sage and the preamble, and the image is where that record is minted.
      # The CLI selects cards with --tag, so this certifies that card alone.
      #
      # An owner failure is an accepted outcome -- the preamble's printed rational
      # (lattice-database#4, sage-extensions#293) is the evidence this step exists to
      # capture -- so it prints the log, the files written and the card's diff and does
      # not gate on the exit status. --minutes bounds the run; a computation still
      # running at the deadline stays in the checkout's exceeded.yaml.
      env:
        PYTHONPATH: ${{ github.workspace 
          }}/.qc-infra/tool-artifacts/pytest_plugins

# Card 6JRR, its certificates and -- from this change -- the card and the child's log, so a
# certificate hash can be checked against the values that produced it.
  consumer-certify:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/${{ github.repository_owner }}/sage:${{ needs.publish.outputs.image_tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - name: Verify the image embeds the requested patch and base revisions
      env:
        SAGE_SOURCE_SHA: ${{ needs.publish.outputs.source_sha }}
      run: |
        test "$(cat /sage/.spinor-source-revision)" = "$SAGE_SOURCE_SHA"
        printf 'spinor patch revision: %s\n' "$(cat /sage/.spinor-source-revision)"
        printf 'Sage build base revision: %s\n' "$(cat /sage/.spinor-base-revision)"
        "$SAGE_BIN" --version
    - name: Check out public consumer assertions
      uses: actions/checkout@v4
      with:
        repository: dzackgarza/sage-extensions
        ref: main
    - name: Install the checked-out sage-extensions source
      run: >-
        uv pip install --python /sage/.venv/bin/python --no-deps -e .
    - name: Install the Sage pytest collector plugin
      uses: actions/checkout@v4
      with:
        repository: dzackgarza/ai-review-ci
        ref: main
        path: .qc-infra
      # The spinor assertion is about the isolated image built from a Sage PR commit:
      # it pins a sage-extensions `main` checkout and a test whose subject is that
      # commit's genus correction. An ordinary develop image has no such patch to
      # assert, so the step keeps its original scope and the rest of the job runs
      # everywhere.
    - name: Certify lattice-database card 6JRR
      run: |
        set -uo pipefail
        checkout=/repos/lattice-database
        git -C "${checkout}" rev-parse HEAD
        set +e
        # `--root` is not optional here. The CLI's root defaults to `Path()`, the process's
        # working directory, and this step runs in the job's workspace -- a sage-extensions
        # checkout -- so `corpus.load` looks for `families.yaml` there and dies before any
        # computation (run 42362483952, 12:28:20Z: `FileNotFoundError: [Errno 2] No such file
        # or directory: 'families.yaml'`, exit 1, no card diff, no certificate written). The
        # corpus is the lattice-database checkout, wherever the step happens to stand.
        PYTHONPATH="/repos/research/src:${checkout}/src" \
          /sage/.venv/bin/python -m latticedb certify --tag 6JRR --minutes 20 \
          --root "${checkout}" \
          > /tmp/certify-6JRR.log 2>&1
        status=$?
        set -e
        echo "certify --tag 6JRR exited ${status}"
        tail -n 200 /tmp/certify-6JRR.log
        echo "--- certificate files"
        ( cd "${checkout}" && git status --porcelain -- certificates | head -50 )
        echo "--- the card's diff"
        ( cd "${checkout}" && git diff -- lattices/6JRR.md | head -200 )
        echo "--- the ledgers, if the run added to them"
        ( cd "${checkout}" && git diff -- failures.yaml exceeded.yaml | head -200 ) || true
        echo "certify is evidence, not a gate: exit ${status} is reported above"

    # The certificates alone cannot show what they certify: their hashes commit to card values,
    # and the card a run writes lives in the container and dies with it. Run 42407502517's
    # artifact listed new 6JRR certificate keys against the locked revision while carrying
    # neither the card they were computed from nor the child's own exit status. Both travel here.
    - name: Upload the certificates the run wrote
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: latticedb-certificates-6JRR
        path: |
          /repos/lattice-database/certificates/
          /repos/lattice-database/lattices/6JRR.md
          /tmp/certify-6JRR.log
        if-no-files-found: warn

      # The stage-1 research records, reproduced inside the image. Each record is a
      # script beside the `-run.txt` it produced; that file opens with the block the
      # script prints first, its provenance (provider pin, source roots, Sage version,
      # image rootfs, the sage_extensions path), and that block describes the machine
      # rather than the mathematics. The comparison drops it -- the lines from the
      # opening `provenance` to the first blank line -- and holds every non-blank line
      # after it, right-trimmed, to the committed file. A differing result line fails
      # the job and prints the diff.

# The research records reproduced inside the image. Independent of the calls above: run
# 42407502517 lost these to the serial one-hour budget, not to a failure in them.
  consumer-records:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/${{ github.repository_owner }}/sage:${{ needs.publish.outputs.image_tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - name: Verify the image embeds the requested patch and base revisions
      env:
        SAGE_SOURCE_SHA: ${{ needs.publish.outputs.source_sha }}
      run: |
        test "$(cat /sage/.spinor-source-revision)" = "$SAGE_SOURCE_SHA"
        printf 'spinor patch revision: %s\n' "$(cat /sage/.spinor-source-revision)"
        printf 'Sage build base revision: %s\n' "$(cat /sage/.spinor-base-revision)"
        "$SAGE_BIN" --version
    - name: Check out public consumer assertions
      uses: actions/checkout@v4
      with:
        repository: dzackgarza/sage-extensions
        ref: main
    - name: Install the checked-out sage-extensions source
      run: >-
        uv pip install --python /sage/.venv/bin/python --no-deps -e .
    - name: Install the Sage pytest collector plugin
      uses: actions/checkout@v4
      with:
        repository: dzackgarza/ai-review-ci
        ref: main
        path: .qc-infra
      # The spinor assertion is about the isolated image built from a Sage PR commit:
      # it pins a sage-extensions `main` checkout and a test whose subject is that
      # commit's genus correction. An ordinary develop image has no such patch to
      # assert, so the step keeps its original scope and the rest of the job runs
      # everywhere.
    - name: Reproduce the stage-1 research records
      run: |
        set -uo pipefail
        checkout=/repos/research
        git -C "${checkout}" rev-parse HEAD
        status=0
        # coble_I18_vinberg-chamber is the stage-2 record: Vinberg's algorithm on
        # I_{1,8} with candidates k_0 >= 1, nine walls, and its printed Gram matrix is
        # the comparison target -- the whole post-provenance body is compared, as for
        # the stage-1 records.
        for record in coble_isotropic_orbits coble_plane-half-f2 coble_I18_vinberg-chamber; do
          script="${checkout}/computations/reports/${record}.py"
          expected="${checkout}/computations/reports/${record}-run.txt"
          actual="/tmp/${record}.out"
          test -f "${script}" && test -f "${expected}"
          PYTHONPATH="/repos/research/src:${checkout}/src" \
            /sage/.venv/bin/python "${script}" > "${actual}" 2>&1 || {
              echo "${record}: the script exited non-zero; its output follows"
              cat "${actual}"
              status=1
              continue
            }
          /sage/.venv/bin/python - "${expected}" "${actual}" "${record}" <<'COMPARE' || status=1
        import difflib
        import re
        import sys

        expected_path, actual_path, name = sys.argv[1:4]

        # Several records print the wall-clock cost of a step beside its result, and a rerun
        # changes it: on coble_plane-half-f2 three trailing `(152 s)` annotations moved while
        # every mathematical value matched, and the comparison reported the second run's timing
        # as a defect in the first (sage#16). Two forms occur across the compared records and
        # both are elapsed time rather than mathematics -- a trailing `(152 s)`, and prose such
        # as `materialised in 29.8s` or `built in 295 s`, which run 42362483952 moved on
        # coble_isotropic_orbits. Both are removed before the lines are compared and printed
        # separately as diagnostics. Nothing else is relaxed: every other character is still
        # compared, and a changed mathematical value fails the step with its diff.
        TIMING = re.compile(r"\s*\(\s*\d+(?:\.\d+)?\s*s\s*\)")
        INLINE_TIMING = re.compile(r"\bin \d+(?:\.\d+)?\s*s\b")


        def lines_of(path):
            """The record's lines without the provenance block it prints first."""
            lines = open(path, encoding="utf-8").read().splitlines()
            if lines and lines[0].strip() == "provenance":
                while lines and lines[0].strip():
                    lines.pop(0)
                while lines and not lines[0].strip():
                    lines.pop(0)
            return [line.rstrip() for line in lines if line.strip()]


        def annotation(line):
            """Whatever elapsed-time annotation the line carries, for the diagnostics."""
            found = [match.group(0).strip() for match in (TIMING.search(line), INLINE_TIMING.search(line)) if match]
            return ", ".join(found) if found else None


        def without_timing(line):
            return INLINE_TIMING.sub("in <elapsed>", TIMING.sub("", line))


        committed = lines_of(expected_path)
        printed = lines_of(actual_path)
        want = [without_timing(line) for line in committed]
        got = [without_timing(line) for line in printed]

        if want == got:
            print(f"{name}: reproduced, {len(got)} result lines match")
            moved = [(was, now) for was, now, here, there in zip(committed, printed, want, got) if was != now]
            for was, now in moved:
                print(f"{name}: timing only, not compared: committed {annotation(was)}, this run {annotation(now)}")
            if moved:
                print(f"{name}: {len(moved)} of {len(got)} lines matched once their timing annotation was removed")
            raise SystemExit(0)

        print(f"{name}: differs")
        print("\n".join(difflib.unified_diff(want, got, "committed", "run here", lineterm="", n=2)))
        for was, now in ((was, now) for was, now, here, there in zip(committed, printed, want, got) if here != there):
            if None not in (annotation(was), annotation(now)) and annotation(was) != annotation(now):
                print(f"{name}: and that line's timing annotation is not the only thing that moved: committed {annotation(was)}, this run {annotation(now)}")
        raise SystemExit(1)
        COMPARE
        done
        exit "${status}"

      # The other stage-1 records, compared by the same rule: the provenance block is
      # dropped and every non-blank line after it, right-trimmed, is held to the
      # committed run file. A missing run file fails the step and says so -- a record
      # with no committed run has nothing to reproduce against, and is not skipped.
    - name: Reproduce the stage-1 known-family records
      run: |
        set -uo pipefail
        checkout=/repos/research
        git -C "${checkout}" rev-parse HEAD
        status=0
        for record in coble_plane-half-index coble_TEn-dictionaries coble_TEn-sandwich coble_TEn-opplus-split; do
          script="${checkout}/computations/reports/${record}.py"
          expected="${checkout}/computations/reports/${record}-run.txt"
          actual="/tmp/${record}.out"
          if [ ! -f "${script}" ]; then
            echo "${record}: no script in this checkout"; status=1; continue
          fi
          if [ ! -f "${expected}" ]; then
            echo "${record}: no committed run file beside it; nothing to compare against"
            status=1; continue
          fi
          PYTHONPATH="${checkout}/src" \
            /sage/.venv/bin/python "${script}" > "${actual}" 2>&1 || {
              echo "${record}: the script exited non-zero; its output follows"
              cat "${actual}"; status=1; continue
            }
          /sage/.venv/bin/python - "${expected}" "${actual}" "${record}" <<'COMPARE' || status=1
        import difflib
        import re
        import sys

        expected_path, actual_path, name = sys.argv[1:4]

        # Several records print the wall-clock cost of a step beside its result, and a rerun
        # changes it: on coble_plane-half-f2 three trailing `(152 s)` annotations moved while
        # every mathematical value matched, and the comparison reported the second run's timing
        # as a defect in the first (sage#16). Two forms occur across the compared records and
        # both are elapsed time rather than mathematics -- a trailing `(152 s)`, and prose such
        # as `materialised in 29.8s` or `built in 295 s`, which run 42362483952 moved on
        # coble_isotropic_orbits. Both are removed before the lines are compared and printed
        # separately as diagnostics. Nothing else is relaxed: every other character is still
        # compared, and a changed mathematical value fails the step with its diff.
        TIMING = re.compile(r"\s*\(\s*\d+(?:\.\d+)?\s*s\s*\)")
        INLINE_TIMING = re.compile(r"\bin \d+(?:\.\d+)?\s*s\b")


        def lines_of(path):
            """The record's lines without the provenance block it prints first."""
            lines = open(path, encoding="utf-8").read().splitlines()
            if lines and lines[0].strip() == "provenance":
                while lines and lines[0].strip():
                    lines.pop(0)
                while lines and not lines[0].strip():
                    lines.pop(0)
            return [line.rstrip() for line in lines if line.strip()]


        def annotation(line):
            """Whatever elapsed-time annotation the line carries, for the diagnostics."""
            found = [match.group(0).strip() for match in (TIMING.search(line), INLINE_TIMING.search(line)) if match]
            return ", ".join(found) if found else None


        def without_timing(line):
            return INLINE_TIMING.sub("in <elapsed>", TIMING.sub("", line))


        committed = lines_of(expected_path)
        printed = lines_of(actual_path)
        want = [without_timing(line) for line in committed]
        got = [without_timing(line) for line in printed]

        if want == got:
            print(f"{name}: reproduced, {len(got)} result lines match")
            moved = [(was, now) for was, now, here, there in zip(committed, printed, want, got) if was != now]
            for was, now in moved:
                print(f"{name}: timing only, not compared: committed {annotation(was)}, this run {annotation(now)}")
            if moved:
                print(f"{name}: {len(moved)} of {len(got)} lines matched once their timing annotation was removed")
            raise SystemExit(0)

        print(f"{name}: differs")
        print("\n".join(difflib.unified_diff(want, got, "committed", "run here", lineterm="", n=2)))
        for was, now in ((was, now) for was, now, here, there in zip(committed, printed, want, got) if here != there):
            if None not in (annotation(was), annotation(now)) and annotation(was) != annotation(now):
                print(f"{name}: and that line's timing annotation is not the only thing that moved: committed {annotation(was)}, this run {annotation(now)}")
        raise SystemExit(1)
        COMPARE
        done
        exit "${status}"

      # lattice-database's owner contracts, run inside the image against the image's own
      # sage_extensions and sage_julia_bridge -- no PYTHONPATH binding to a checkout, so
      # what is observed is the published pair. The A2 contract
      # (test_positive_a2_genus_and_orthogonal_group_are_owned_by_the_lattice) times out
      # at 60 s on a GitHub runner inside the Julia bridge's stderr drain
      # (sage_julia_bridge/interface.py:279); sage-extensions#300 is that defect and its
      # acceptance is this module returning here.
    - name: Upload the reproduced record outputs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: research-stage1-records
        path: |
          /tmp/coble_isotropic_orbits.out
          /tmp/coble_plane-half-f2.out
          /tmp/coble_I18_vinberg-chamber.out
          /tmp/coxiter-I18.out
        if-no-files-found: warn

  # The image is also the environment for hosts that cannot run Docker, chroot
  # or PRoot, which docker/sage-image.py provides by unpacking the image and
  # running it under bubblewrap. This job is the only place that path runs on a
  # host it was not developed on; a regression there is invisible to every
  # consumer that uses the container.

# The provider's owner contracts against the image's packages (#15).
  consumer-contracts:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/${{ github.repository_owner }}/sage:${{ needs.publish.outputs.image_tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - name: Verify the image embeds the requested patch and base revisions
      env:
        SAGE_SOURCE_SHA: ${{ needs.publish.outputs.source_sha }}
      run: |
        test "$(cat /sage/.spinor-source-revision)" = "$SAGE_SOURCE_SHA"
        printf 'spinor patch revision: %s\n' "$(cat /sage/.spinor-source-revision)"
        printf 'Sage build base revision: %s\n' "$(cat /sage/.spinor-base-revision)"
        "$SAGE_BIN" --version
    - name: Check out public consumer assertions
      uses: actions/checkout@v4
      with:
        repository: dzackgarza/sage-extensions
        ref: main
    - name: Install the checked-out sage-extensions source
      run: >-
        uv pip install --python /sage/.venv/bin/python --no-deps -e .
    - name: Install the Sage pytest collector plugin
      uses: actions/checkout@v4
      with:
        repository: dzackgarza/ai-review-ci
        ref: main
        path: .qc-infra
      # The spinor assertion is about the isolated image built from a Sage PR commit:
      # it pins a sage-extensions `main` checkout and a test whose subject is that
      # commit's genus correction. An ordinary develop image has no such patch to
      # assert, so the step keeps its original scope and the rest of the job runs
      # everywhere.
    - name: Run lattice-database's owner contracts against the image's packages
      run: |
        set -uo pipefail
        checkout=/repos/sage-extensions
        git -C "${checkout}" rev-parse HEAD
        module="${checkout}/tests/lattices/test_lattice_database_owner_contracts.sage"
        test -f "${module}"
        /sage/.venv/bin/python -c 'import sage_extensions, sage_julia_bridge; print(sage_extensions.__file__); print(sage_julia_bridge.__file__)'
        set +e
        timeout 1500 /sage/.venv/bin/python -m pytest -o addopts= \
          --durations=0 -q -p qc_sage_session "${module}"
        status=$?
        set -e
        if [ "${status}" -eq 124 ]; then
          echo "the owner contracts did not finish within 1500 s"
        fi
        echo "owner contracts exited ${status}"
        exit "${status}"

      # The same record's chamber read by the other engine: CoxIter on the nine-node
      # diagram the Vinberg run prints. The in-tree row for (9, 9, 1) calls that diagram
      # a chain, which is the claim this log lets the research chat check. It prints and
      # does not gate: CoxIter's verdict on the diagram is evidence, not an image defect.
      env:
        PYTHONPATH: ${{ github.workspace 
          }}/.qc-infra/tool-artifacts/pytest_plugins

# CoxIter on the I_{1,8} chamber (#18): seconds of work that a serial job put last, where
# two runs in a row never reached it.
  consumer-chamber:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/${{ github.repository_owner }}/sage:${{ needs.publish.outputs.image_tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - name: Verify the image embeds the requested patch and base revisions
      env:
        SAGE_SOURCE_SHA: ${{ needs.publish.outputs.source_sha }}
      run: |
        test "$(cat /sage/.spinor-source-revision)" = "$SAGE_SOURCE_SHA"
        printf 'spinor patch revision: %s\n' "$(cat /sage/.spinor-source-revision)"
        printf 'Sage build base revision: %s\n' "$(cat /sage/.spinor-base-revision)"
        "$SAGE_BIN" --version
    - name: Read the I_{1,8} chamber with CoxIter
      run: |
        # -e matters here: the acceptance below is a Python assertion, and without it a failing
        # comparison would fall through to the greps and the closing echo and leave the step green.
        set -euo pipefail
        record=/repos/research/computations/reports/coble_I18_vinberg-chamber-run.txt
        test -f "${record}"
        coxiter="$(command -v coxiter)"
        echo "coxiter: ${coxiter}"
        # CoxIter reads a graph file: digits on the first line are the vertex count, then one
        # `<a> <b> <order>` per edge. A research record is neither: in run 42362483952 the file
        # was handed over as it stands, CoxIter took the digits of its opening root line as a
        # vertex count and reported an eight-vertex simplex with Euler characteristic 1/256 --
        # exit 0, and no reading of the chamber. Changing that one number in the record to 11 and
        # nothing else makes CoxIter report eleven vertices and 1/2048, which is the parser path
        # rather than a guess from the count. The record does state the graph explicitly, in
        # "walls: 9", the "edges (i, j, label)" list and its "label counts"; those are what the
        # graph below is built from, and what the reading is checked against.
        graph="$(mktemp)"
        /sage/.venv/bin/python - "${record}" "${graph}" <<'GRAPH'
        import ast
        import re
        import sys

        record, destination = sys.argv[1:3]
        text = open(record, encoding="utf-8").read()
        walls = re.search(r"^\s*walls:\s*(\d+)", text, re.M)
        edges = re.search(r"^\s*edges \(i, j, label\):\s*(\[.*\])", text, re.M)
        assert walls and edges, "the record states no chamber graph"
        graph = ast.literal_eval(edges.group(1))
        declared = re.search(r"^\s*label counts:\s*(\{.*\})", text, re.M)
        assert declared, "the record states no label counts"
        counted = {}
        for _, _, label in graph:
            counted[label] = counted.get(label, 0) + 1
        assert counted == ast.literal_eval(declared.group(1)), (
            "the edge list and the label counts disagree: %r vs %r" % (counted, declared.group(1))
        )
        rows = [walls.group(1)] + ["%d %d %d" % tuple(edge) for edge in graph]
        open(destination, "w", encoding="utf-8").write("\n".join(rows) + "\n")
        GRAPH
        echo "--- the graph handed to CoxIter"
        cat "${graph}"
        # The engine's own verdict -- cocompactness, covolume, the characteristic -- is evidence,
        # not a gate, so this one invocation is allowed to report a non-zero status.
        set +e
        "${coxiter}" -v < "${graph}" > /tmp/coxiter-I18.out 2>&1
        verdict_status=$?
        set -e
        echo "coxiter exited ${verdict_status} (its verdict is evidence, not a gate)"
        cat /tmp/coxiter-I18.out
        # Acceptance is the reading, not the exit status: the graph read must be the nine-wall
        # chamber this record states. CoxIter's verdict on it stays evidence, not a gate.
        # The labelled adjacencies are compared, not counted. CoxIter's `-pcm` prints the Coxeter
        # matrix it parsed -- its own representation of the graph, m_ij being 2 where there is
        # no edge -- and that matrix is held to the one the record's edge list defines, entry by
        # entry. A vertex count and a field of definition cannot do this: a different graph can
        # have both.
        # This one feeds the acceptance: the engine must print a matrix for the graph it was
        # given, and a non-zero status here is an input failure that must fail the step.
        "${coxiter}" -pcm < "${graph}" > /tmp/coxiter-I18-matrix.out 2>&1
        cat /tmp/coxiter-I18-matrix.out
        /sage/.venv/bin/python - "${record}" /tmp/coxiter-I18-matrix.out ./coxiter-matrix.checked <<'MATRIX'
        import ast
        import re
        import sys

        record, printed, destination = sys.argv[1:4]
        text = open(record, encoding="utf-8").read()
        walls = int(re.search(r"^\s*walls:\s*(\d+)", text, re.M).group(1))
        edges = ast.literal_eval(re.search(r"^\s*edges \(i, j, label\):\s*(\[.*\])", text, re.M).group(1))
        expected = [[1 if i == j else 2 for j in range(walls)] for i in range(walls)]
        for first, second, label in edges:
            expected[first - 1][second - 1] = expected[second - 1][first - 1] = label
        rows = [
            [int(entry) for entry in line.split(",")]
            for line in open(printed, encoding="utf-8")
            if re.fullmatch(r"[0-9]+(,[0-9]+)+", line.strip())
        ]
        assert rows, "CoxIter printed no Coxeter matrix"
        assert rows == expected, "the parsed adjacencies are not the record's:\n%r\n%r" % (rows, expected)
        open(destination, "w", encoding="utf-8").write("checked %d x %d against the record\n" % (walls, walls))
        print("the parsed labelled adjacencies equal the record's edge list")
        MATRIX
        grep -q "Number of vertices: 9" /tmp/coxiter-I18.out
        grep -q "Guessed dimension: 8" /tmp/coxiter-I18.out
        echo "CoxIter read the nine-wall chamber of ${record}: labelled adjacencies equal to its edge list"

  no-runtime:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      # The script comes from the branch that triggered this run, not from
      # needs.publish.outputs.source_sha: a dispatched spinor image is built
      # from a Sage PR commit that predates it.
    - name: Check out the provisioning script
      uses: actions/checkout@v4
      with:
        sparse-checkout: docker
      # The image is ~14 GB compressed and larger unpacked.
    - name: Free the runner's disk
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        df -h /
    - name: Install bubblewrap
      run: |
        sudo apt-get update
        sudo apt-get install -y bubblewrap
      # Host security policy belongs to the administrator of the host. This job
      # does not change a sysctl or an AppArmor profile to make itself work: it
      # runs where unprivileged user namespaces are already permitted, and
      # reports the configuration as unsupported where they are not. The image
      # build's own check and the container consumer job remain the gate.
    - name: Probe unprivileged user namespaces
      id: runtime
      run: |
        if bwrap --ro-bind / / --proc /proc --dev /dev --unshare-user --unshare-pid -- /bin/true; then
          echo "supported=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "supported=false" >> "$GITHUB_OUTPUT"
        {
          echo "### No-runtime check skipped"
          echo ""
          echo "This runner does not permit unprivileged user namespaces, so the image"
          echo "cannot be run here without a container runtime. The job does not change"
          echo "host policy. The image build's own check and the container consumer job"
          echo "remain the gate."
        } >> "$GITHUB_STEP_SUMMARY"
        echo "::warning::runner does not permit unprivileged user namespaces; no-runtime check skipped"
    - name: Fetch and check the image with no container runtime
      if: steps.runtime.outputs.supported == 'true'
      env:
        IMAGE: ${{ github.repository_owner }}/sage
        IMAGE_TAG: ${{ needs.publish.outputs.image_tag }}
      run: |
        ./docker/sage-image.py --image "$IMAGE" --reference "$IMAGE_TAG" fetch
        ./docker/sage-image.py --image "$IMAGE" --reference "$IMAGE_TAG" check

  # Whether recompressing the research image to zstd would pay is a question about
  # the runner, not about the build: BuildKit exports zstd through an isolated
  # builder (this workflow has one), but a zstd layer is only useful if the daemon
  # that pulls a `container:` job can read it. Docker's classic overlay2 store is
  # not the containerd store, and a layer it cannot read fails the job at container
  # init -- which on the real image would take every consumer down until a rebuild.
  # The question is settled here on an image that costs seconds.
  #
  # Dispatch with zstd_probe=true. What to read:
  #   * `Build and push a zstd-compressed probe` publishes the image and prints its
  #     layer media types; `application/vnd.oci.image.layer.v1.tar+zstd` is the
  #     format under test;
  #   * `zstd-pull` exists only to start that image as its container. Reaching its
  #     step means the runner's daemon pulled a zstd layer, so the real image can be
  #     recompressed; failing at initialization means it cannot, and the layer
  #     layout (research-environment-incremental.Dockerfile) is the lever instead.
  zstd-probe:
    if: github.event_name == 'workflow_dispatch' && inputs.zstd_probe
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
    - uses: docker/setup-buildx-action@v3
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build and push a zstd-compressed probe
      env:
        IMAGE: ghcr.io/${{ github.repository_owner }}/sage:zstd-probe
      run: |
        set -eu
        printf 'FROM debian:trixie\nRUN printf "zstd probe ok\\n" > /probe.txt\n' > "${RUNNER_TEMP}/Dockerfile.zstd-probe"
        cat "${RUNNER_TEMP}/Dockerfile.zstd-probe"
        docker buildx build \
          --file "${RUNNER_TEMP}/Dockerfile.zstd-probe" \
          --tag "${IMAGE}" \
          --output type=image,push=true,compression=zstd,compression-level=3,force-compression=true,oci-mediatypes=true \
          "${RUNNER_TEMP}"
    - name: Show the layer media types it published
      env:
        IMAGE: ghcr.io/${{ github.repository_owner }}/sage:zstd-probe
      run: |
        set -eu
        # The digest a runner would pull, and the compression it would meet.
        digest="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "${IMAGE}")"
        echo "manifest ${digest}"
        docker buildx imagetools inspect --raw "${IMAGE}@${digest}" | tr ',' '\n' | grep -E 'mediaType|"size"'
        docker buildx imagetools inspect --raw "${IMAGE}@${digest}" | grep -q 'tar\+zstd'
        echo "a zstd layer was published"

  zstd-pull:
    needs: zstd-probe
    if: github.event_name == 'workflow_dispatch' && inputs.zstd_probe
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/${{ github.repository_owner }}/sage:zstd-probe
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - name: Read the probe file from inside a container of the zstd image
      run: |
        set -eu
        test "$(cat /probe.txt)" = "zstd probe ok"
        echo "the runner pulled a zstd-compressed layer and started a container from it"

