# Reproduce the PARI stack abort of dzackgarza/sage#32 inside the published
# image that shows it, ghcr.io/dzackgarza/sage@sha256:5304338e…, pinned by
# digest so a later develop rebuild cannot move the experiment underneath it.
# This VM cannot pull that image (15.2 GB compressed, no OCI runtime); a GitHub
# Actions job can, the way lattice-database's `tests` job does (run
# 42948978339, job "Complete project suite and preamble contracts"): inside
# the image, against sage-extensions at main. The abort is the observation,
# not a green job: the job is the issue's acceptance either way, reproducing
# the abort or showing the conditions under which it does not occur.
#
# The job adds one thing to lattice-database's invocation: an environment hook
# this workflow writes into its own checkout, which prints the form's Hessian
# (the matrix sage's __pari__ hands to PARI's qfauto), pari.stacksize(),
# pari.stacksizemax() and the libpari the process maps before every
# QuadraticForm.number_of_automorphisms() call, and the order the call
# returned after it. sage-extensions itself is not modified: the hook module
# and the evidence log are written by this workflow at run time, never by an
# edit of that repository.
#
# What to read in the run: the [sage#32] lines. The two Hessians the issue
# names -- [2,1,0; 1,2,0; 0,0,18] and [2,0,0; 0,6,-3; 0,-3,6] -- must appear
# before their calls; the abort, if it reproduces, follows the prints, and 24
# for both forms with a green module is the "conditions under which the abort
# does not occur" half of the acceptance.

name: Research issue 32 PARI stack abort reproduction

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/research-32-pari-abort-repro.yml

permissions:
  contents: read
  packages: read

concurrency:
  group: research-32-pari-abort-repro-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        shell: bash
    container:
      image: ghcr.io/dzackgarza/sage@sha256:5304338e93819c8f568b7f1f07e1b41afb383f0d18bf22221b8b45de483ad017
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    steps:
      - name: Print the image's own provenance
        run: |
          for stamp in /sage/.spinor-source-revision /sage/.spinor-base-revision /sage/.research-revisions; do
            if [ -f "$stamp" ]; then
              printf '%s:\n' "$stamp"
              cat "$stamp"
            else
              printf '%s: not present in this image\n' "$stamp"
            fi
          done
          "$SAGE_BIN" --version
          /sage/.venv/bin/python -c 'import sys; print(sys.version)'

      - name: Check out sage-extensions at main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: dzackgarza/sage-extensions
          ref: main

      # sage-indefinite-port is checked out and installed at main with
      # sage-extensions, the pair lattice-database's job runs through
      # research's dependencies: the module's primitive-orbit-series contract
      # calls into the port, and the image's own older port does not answer
      # main's sage-extensions (measured on the unpacked image: a TypeError in
      # /repos/sage-indefinite-port's recursive.py that is a version skew, not
      # mathematics).
      - name: Check out sage-indefinite-port at main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: dzackgarza/sage-indefinite-port
          ref: main
          path: sage-indefinite-port

      - name: Check out the shared Sage pytest collector
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: dzackgarza/ai-review-ci
          ref: e3ecc613e2cc41238f6f3717e8107d2a7c2519ba
          path: _ci-support/ai-review-ci

      - name: Install the checked-out sage-extensions source
        run: |
          git rev-parse HEAD
          git log -1 --oneline
          uv pip install --python /sage/.venv/bin/python --no-deps -e .

      - name: Install the checked-out sage-indefinite-port source
        run: >-
          uv pip install --python /sage/.venv/bin/python --no-deps -e sage-indefinite-port

      # The owner suite's own addopts load pytest-timeout and pytest-reportlog
      # (sage-extensions' pyproject.toml); the image's venv ships pytest alone,
      # so the two plugins are installed for this job the way lattice-database's
      # job has them through its dev groups.
      - name: Install the pytest plugins the owner suite's addopts load
        run: >-
          uv pip install --python /sage/.venv/bin/python pytest-timeout pytest-reportlog

      - name: Write the reproduction hook into this checkout
        run: |
          cat > sage32_repro_hook.py <<'HOOK'
          """Reproduction evidence for dzackgarza/sage#32.

          This module is written into the sage-extensions checkout by
          .github/workflows/research-32-pari-abort-repro.yml at run time;
          sage-extensions itself is not modified. install() wraps
          QuadraticForm.number_of_automorphisms so that, before every call, the form's
          Hessian (the matrix Sage's __pari__ hands to PARI's qfauto), pari.stacksize(),
          pari.stacksizemax() and the libpari the process maps are printed and flushed,
          and the order the call returned is printed after it returns. The defect under
          investigation aborts the process inside the call, so anything still buffered
          is lost; every line is also appended to sage32-repro-evidence.log beside this
          module, which survives the abort.
          """

          import sys

          TAG = "[sage#32] "
          EVIDENCE = "sage32-repro-evidence.log"
          _calls = [0]


          def _mapped_libpari():
              """The libpari files this process maps, deduplicated."""
              with open("/proc/self/maps") as maps:
                  return sorted({line.split()[-1] for line in maps if "libpari" in line})


          def _record(text):
              """Print and flush, and append the same line to the evidence file."""
              print(TAG + text)
              sys.stdout.flush()
              with open(EVIDENCE, "a") as evidence:
                  evidence.write(TAG + text + "\n")


          def install():
              """Wrap QuadraticForm.number_of_automorphisms with the printing above."""
              from sage.all import pari
              from sage.quadratic_forms.quadratic_form import QuadraticForm
              from sage.quadratic_forms.quadratic_form__automorphisms import (
                  number_of_automorphisms as original,
              )

              if getattr(QuadraticForm.number_of_automorphisms, "_sage32_repro", False):
                  return

              def number_of_automorphisms(self, *args, **kwargs):
                  _calls[0] += 1
                  call = _calls[0]
                  _record(f"number_of_automorphisms() call {call}")
                  _record(f"Hessian:\n{self.Hessian_matrix()}")
                  _record(f"pari.stacksize() = {pari.stacksize()}")
                  _record(f"pari.stacksizemax() = {pari.stacksizemax()}")
                  for path in _mapped_libpari():
                      _record(f"libpari mapped: {path}")
                  order = original(self, *args, **kwargs)
                  _record(f"number_of_automorphisms() call {call} returned {order}")
                  return order

              number_of_automorphisms._sage32_repro = True
              QuadraticForm.number_of_automorphisms = number_of_automorphisms
              _record("hook installed: QuadraticForm.number_of_automorphisms wrapped")
              _record(f"pari.stacksize() at install = {pari.stacksize()}")
              _record(f"pari.stacksizemax() at install = {pari.stacksizemax()}")
              for path in _mapped_libpari():
                  _record(f"libpari mapped at install: {path}")
          HOOK
          /sage/.venv/bin/python -m py_compile sage32_repro_hook.py

      # Verbatim from lattice-database's tests workflow (the "Validate preamble
      # owner contracts" step), with two additions: the hook is imported and
      # installed before the Julia-bridge warm-up so every call in the process
      # is printed, and --capture=no so the prints reach the run's log even if
      # the process aborts inside the call, where pytest's capture buffer
      # would die with it unprinted.
      - name: Run the owner contracts the way lattice-database's job does
        env:
          PYTHONPATH: ${{ github.workspace }}/_ci-support/ai-review-ci/tool-artifacts/pytest_plugins
        run: |
          /sage/.venv/bin/python -c 'import sage.all, sys, pytest; import sage32_repro_hook; sage32_repro_hook.install(); from sage.all import ZZ; from sage_extensions.categories.lattices import Lattices; Lattices(ZZ)([[2, -1], [-1, 2]]).orthogonal_group().order(); sys.exit(pytest.main(sys.argv[1:]))' \
            -p qc_sage_session -p qc_unique_inventory --no-time-gates --capture=no \
            tests/lattices/test_lattice_database_owner_contracts.sage

      # The evidence file is written beside the hook with one flush per line,
      # so it survives the abort; this step prints it whatever the run's exit
      # status was.
      - name: Print the evidence the hook recorded
        if: always()
        run: |
          if [ -f sage32-repro-evidence.log ]; then
            cat sage32-repro-evidence.log
          else
            echo "the hook wrote no evidence file"
          fi
